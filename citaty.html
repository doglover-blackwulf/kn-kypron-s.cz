<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citáty | Knížky pro nás</title>
    <meta name="description" content="Citáty a inspirace ze světa knih a příběhů na webu Knížky pro nás." />
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Pristina&display=swap" rel="stylesheet" />
    <style>
      .drbat-section { position: relative; }
      .drbat-only { display: none; }
      .drbat-section .add-button { display: flex; }
      .drbat-section .drbat-container { display: block; }
      .add-button { position: absolute; bottom: 2rem; right: 2rem; width: 60px; height: 60px; background: #000; color: #fff; border: 3px solid #fff; border-radius: 50%; font-size: 2rem; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 999; display: none; }
      .add-button:hover { transform: scale(1.1); }
      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; }
      .modal-overlay.active { display: block; }
      .modal-panel { position: fixed; top: 50%; right: 0; transform: translateY(-50%); width: 66.67%; max-width: 900px; height: 80vh; background: #fff; border-radius: 12px 0 0 12px; box-shadow: -4px 0 16px rgba(0,0,0,.2); display: none; flex-direction: column; padding: 2rem; overflow-y: auto; z-index: 1001; }
      .modal-panel.active { display: flex; }
      .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #666; }
      .password-section { margin-bottom: 2rem; padding: 1.5rem; background: #f5f5f5; border-radius: 8px; }
      .password-section label, .form-group label { display: block; font-weight: 700; margin-bottom: .5rem; color: #333; }
      .password-section input, .form-group input[type="file"], .form-group textarea { width: 100%; padding: .75rem; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; font-family: Georgia, serif; }
      .password-error { color: #d32f2f; font-size: .85rem; display: none; }
      .password-error.show { display: block; }
      .form-group { display: none; margin-bottom: 1.5rem; }
      .form-group.active { display: block; }
      .form-group textarea { min-height: 200px; resize: vertical; }
      .stars-container, .drbat-stars { display: flex; gap: .5rem; margin: 1rem 0; }
      .star { font-size: 2rem; cursor: pointer; color: #ddd; }
      .star.active { color: #ffc107; }
      .save-button { background: #333; color: #fff; border: 0; padding: .75rem 1.5rem; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 1rem; }
      .drbat-container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; display: none; }
      .drbat-section .drbat-container { display: block; }
      .drbat-item { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
      .drbat-item img { max-width: 100%; height: auto; margin-bottom: 1rem; border-radius: 8px; }
      .drbat-text { font-size: 1rem; line-height: 1.6; margin-bottom: 1rem; color: #333; white-space: pre-wrap; }
      .drbat-stars { gap: .25rem; margin-bottom: 1rem; }
      .drbat-stars .star { font-size: 1.25rem; cursor: default; }
    </style>
  </head>
  <body class="section-body">
    <nav class="section-nav">
      <div class="logo">📚 Knížky pro nás</div>
      <a href="index.html">Zpět</a>
    </nav>

    <main class="section-page">
      <article class="section-article" id="citaty-page">
        <span class="snowflake snowflake-one" aria-hidden="true">❄</span>
        <span class="snowflake snowflake-two" aria-hidden="true">✦</span>
        <span class="snowflake snowflake-three" aria-hidden="true">❅</span>
        <span class="snowflake snowflake-four" aria-hidden="true">❄</span>
        <span class="snowflake snowflake-five" aria-hidden="true">✧</span>
        <h1 id="section-title" class="section-title">Citáty</h1>
        <p class="quote" id="quote-text"></p>
      </article>
      <p class="description" id="description-text"></p>
      
      <div class="drbat-section">
        <button class="add-button" id="add-btn" aria-label="Přidat příspěvek">+</button>
        <div class="drbat-container" id="drbat-list"></div>
      </div>
    </main>

    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-panel" id="modal-panel">
      <button class="modal-close" id="close-btn" aria-label="Zavřít">✕</button>
      <div class="password-section"><label for="password1">Heslo pro obrázek:</label><input type="password" id="password1" placeholder="Zadej heslo..."><div class="password-error" id="password1-error">Špatné heslo!</div></div>
      <div class="password-section"><label for="password2">Heslo pro text:</label><input type="password" id="password2" placeholder="Zadej heslo..."><div class="password-error" id="password2-error">Špatné heslo!</div></div>
      <div class="form-group" id="image-form"><label for="image-input">Vložit obrázek:</label><input type="file" id="image-input" accept="image/*"></div>
      <div class="form-group" id="text-form"><label for="text-input">Tvůj příspěvek:</label><textarea id="text-input" rows="12" placeholder="Napiš cokoliv..."></textarea><label>Hodnocení:</label><div class="stars-container" id="stars-container"><span class="star" data-rating="1">★</span><span class="star" data-rating="2">★</span><span class="star" data-rating="3">★</span><span class="star" data-rating="4">★</span><span class="star" data-rating="5">★</span></div><button class="save-button" id="save-btn">Uložit</button></div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const title = params.get('title') || 'Citáty';
      const isDrbat = title === 'Pojďme drbat';
      document.body.classList.toggle('drbat-theme', isDrbat);
      document.getElementById('section-title').textContent = title;

      if (isDrbat) {
        document.getElementById('citaty-page').classList.remove('with-quote');
        document.querySelector('.drbat-section').classList.add('drbat-section');
      } else if (title === 'Citáty') {
        document.getElementById('quote-text').textContent = 'Buď jako zima. Chladná ale nádherná.';
        document.getElementById('description-text').textContent = 'Ahoj lidi, tady můžete najít různé citáty a fanarty z vašich oblíbených knížek, filmů, seriálů, mang a příběhů. A pokud jste umělci a děláte kresby nebo animace, můžete mi napsat na Instagram: knihy.pro.nas.';
        document.getElementById('citaty-page').classList.add('with-quote');
        document.getElementById('description-text').classList.add('show-description');
      }

      const PASSWORD1 = 'Deraxy 112';
      const PASSWORD2 = 'Laitry 113';
      let currentRating = 0;
      let currentImage = null;
      const $ = id => document.getElementById(id);

      function displayItem(item) {
        const el = document.createElement('div');
        el.className = 'drbat-item';
        if (item.image) { const img = document.createElement('img'); img.src = item.image; img.alt = 'Obrázek příspěvku'; el.appendChild(img); }
        if (item.text) { const text = document.createElement('div'); text.className = 'drbat-text'; text.textContent = item.text; el.appendChild(text); }
        if (item.rating) { const stars = document.createElement('div'); stars.className = 'drbat-stars'; for (let i = 1; i <= 5; i++) { const star = document.createElement('span'); star.className = 'star' + (i <= item.rating ? ' active' : ''); star.textContent = '★'; stars.appendChild(star); } el.appendChild(stars); }
        $('drbat-list').appendChild(el);
      }
      function loadData() { try { JSON.parse(localStorage.getItem('drbat-items') || '[]').forEach(displayItem); } catch {} }
      function resetForm() { $('password1').value = ''; $('password2').value = ''; $('image-input').value = ''; $('text-input').value = ''; currentRating = 0; currentImage = null; $('image-form').classList.remove('active'); $('text-form').classList.remove('active'); document.querySelectorAll('#stars-container .star').forEach(s => s.classList.remove('active')); document.querySelectorAll('.password-error').forEach(e => e.classList.remove('show')); }
      function closeModal() { $('modal-overlay').classList.remove('active'); $('modal-panel').classList.remove('active'); resetForm(); }
      if (isDrbat) {
        loadData();
        $('add-btn').addEventListener('click', () => { $('modal-overlay').classList.add('active'); $('modal-panel').classList.add('active'); });
        $('close-btn').addEventListener('click', closeModal);
        $('modal-overlay').addEventListener('click', closeModal);
        $('password1').addEventListener('change', e => { const ok = e.target.value === PASSWORD1; $('image-form').classList.toggle('active', ok); $('password1-error').classList.toggle('show', !ok); });
        $('password2').addEventListener('change', e => { const ok = e.target.value === PASSWORD2; $('text-form').classList.toggle('active', ok); $('password2-error').classList.toggle('show', !ok); });
        $('image-input').addEventListener('change', e => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = ev => currentImage = ev.target.result; reader.readAsDataURL(file); } });
        $('stars-container').addEventListener('click', e => { if (e.target.classList.contains('star')) { currentRating = Number(e.target.dataset.rating); document.querySelectorAll('#stars-container .star').forEach(s => s.classList.toggle('active', Number(s.dataset.rating) <= currentRating)); } });
        $('save-btn').addEventListener('click', () => { const text = $('text-input').value.trim(); if (!currentImage && !text) return alert('Vyplň alespoň něco!'); const item = { image: currentImage, text, rating: currentRating }; const items = JSON.parse(localStorage.getItem('drbat-items') || '[]'); items.push(item); localStorage.setItem('drbat-items', JSON.stringify(items)); displayItem(item); closeModal(); });
      }
    </script>
  </body>
</html>
