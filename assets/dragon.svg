  <path fill="#d9ad3d" stroke="#fff" stroke-width="5" stroke-linejoin="round" d="M450 205 420 285l30 120 30-120Z"/>

  <!-- černé spodní části -->
  <path fill="#050505" stroke="#fff" stroke-width="7" d="M420 272 384 340l42-24 24 53 24-53 42 24-36-68-30 18Z"/>
  <path fill="#050505" stroke="#fff" stroke-width="7" d="M432 395c-8 45-18 91-31 137l49-47 49 47c-13-46-23-92-31-137Z"/>

