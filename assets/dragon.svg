<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Černý drak letící z pohledu shora</title>
  <desc id="desc">Silný černý drak s roztaženými křídly, dlouhým ocasem a koulí na jeho konci.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <radialGradient id="orb" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".18" stop-color="#bdbdbd"/>
      <stop offset=".52" stop-color="#4b4b4b"/>
      <stop offset="1" stop-color="#090909"/>
    </radialGradient>
  </defs>

  <g opacity=".22" filter="url(#softShadow)" transform="translate(0 8)">
    <path fill="#000" d="M250 111C221 111 197 132 190 163c-5 23-4 44 0 62l-12 32c-8 21-16 38-24 52 22-12 40-28 53-48 12 30 26 46 43 61 17-15 31-31 43-61 13 20 31 36 53 48-8-14-16-31-24-52l-12-32c4-18 5-39 0-62-7-31-31-52-60-52Z"/>
  </g>

  <!-- Levé křídlo, pohled shora -->
  <path fill="#090909" stroke="#fff" stroke-width="3" stroke-linejoin="round" d="M238 122C201 101 161 79 109 69 70 61 35 64 7 80c39 6 66 18 91 34-28-5-58-1-88 13 37 7 66 20 91 39-22 3-44 13-65 31 43-1 80 8 113 29 16 10 30 19 43 29-2-25 2-47 12-66 12-23 25-43 34-67Z"/>
  <!-- Pravé křídlo, pohled shora -->
