  <path fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" d="M450 430c0 78 8 124 1 169-6 39-20 62-30 78"/>
  <circle cx="416" cy="686" r="25" fill="#111" stroke="#fff" stroke-width="6"/>
</svg>
