  <!-- levé černé křídlo -->
  <path fill="#050505" stroke="#fff" stroke-width="8" stroke-linejoin="round" d="M430 250C340 210 245 150 120 145 65 143 24 160 5 190c72-2 135 20 190 57-65-9-125 2-180 36 72 5 133 28 190 70-47 5-91 24-130 59 96-10 175 10 250 62 38 26 75 47 117 68-15-73-17-164 8-292Z"/>
  <!-- pravé černé křídlo -->
