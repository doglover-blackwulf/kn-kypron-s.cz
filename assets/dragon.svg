<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" role="img" aria-labelledby="title">
  <title id="title">Černý drak se zlatými křídly</title>
  <defs>
    <style>
      .dragon-body { fill: #000; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
      .dragon-wings { fill: #d4af37; stroke: #fff; stroke-width: 1.5; }
      .dragon-detail { stroke: #fff; stroke-width: 1; fill: none; }
    </style>
  </defs>
  
  <!-- Levé křídlo -->
  <path class="dragon-wings" d="M 100 80 Q 60 90 40 140 Q 35 160 45 175 Q 65 155 85 110 Z"/>
  
  <!-- Pravé křídlo -->
  <path class="dragon-wings" d="M 100 80 Q 140 90 160 140 Q 165 160 155 175 Q 135 155 115 110 Z"/>
  
  <!-- Tělo draka -->
  <ellipse class="dragon-body" cx="100" cy="120" rx="16" ry="45"/>
  
  <!-- Hlava -->
  <circle class="dragon-body" cx="100" cy="70" r="18"/>
  
  <!-- Oči -->
  <circle fill="#ffd700" cx="95" cy="68" r="3"/>
  <circle fill="#ffd700" cx="105" cy="68" r="3"/>
  
  <!-- Paprskovité detaily na hlavě -->
  <line class="dragon-detail" x1="95" y1="50" x2="93" y2="40"/>
  <line class="dragon-detail" x1="100" y1="48" x2="100" y2="36"/>
  <line class="dragon-detail" x1="105" y1="50" x2="107" y2="40"/>
  
  <!-- Ocas -->
  <path class="dragon-body" d="M 100 165 Q 100 190 95 220 Q 92 240 90 255"/>
  
  <!-- Květina/hvězdička na konci ocasu -->
  <g transform="translate(90, 265)">
    <circle class="dragon-body" cx="0" cy="0" r="5"/>
    <path class="dragon-body" d="M 0,-8 L 2,-3 L 8,-2 L 4,2 L 5,8 L 0,5 L -5,8 L -4,2 L -8,-2 L -2,-3 Z"/>
  </g>
  
  <!-- Detailní linky na křídlech -->
  <line class="dragon-detail" x1="75" y1="110" x2="65" y2="145"/>
  <line class="dragon-detail" x1="80" y1="95" x2="70" y2="140"/>
  <line class="dragon-detail" x1="125" y1="110" x2="135" y2="145"/>
  <line class="dragon-detail" x1="120" y1="95" x2="130" y2="140"/>
</svg>