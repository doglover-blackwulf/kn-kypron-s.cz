  <!-- Hlava, hřbet a ocas -->
  <path fill="#050505" stroke="#fff" stroke-width="3" stroke-linejoin="round" d="M250 67c-16 0-28 13-30 30l-9 34c-7 25-11 47-9 67 2 17 8 31 14 43-7 25-17 51-32 75 22-14 39-31 52-52 7 11 12 17 14 19 2-2 7-8 14-19 13 21 30 38 52 52-15-24-25-50-32-75 6-12 12-26 14-43 2-20-2-42-9-67l-9-34c-2-17-14-30-30-30Z"/>

  <!-- Rohy, oči a obličej -->
  <path fill="#050505" stroke="#fff" stroke-width="3" d="M232 80 207 54l7 39m29-13-4-38m20 38 4-38m5 12 25-26-7 39"/>
  <path fill="#d9b83f" stroke="#fff" stroke-width="1.5" d="M235 91c5-5 10-7 15-7s10 2 15 7l-6 10c-6 3-12 3-18 0Z"/>
  <circle fill="#050505" cx="244" cy="93" r="2"/>
  <circle fill="#050505" cx="256" cy="93" r="2"/>
  <path fill="none" stroke="#fff" stroke-width="2" d="M242 106q8 6 16 0"/>

  <!-- Membrány a hřbetní linie -->
  <g fill="none" stroke="#777" stroke-width="2" opacity=".75">
    <path d="M218 128C171 105 121 88 65 79"/>
    <path d="M214 145C165 127 119 116 58 112"/>
    <path d="M211 164C159 151 115 148 53 151"/>
    <path d="M302 128C349 105 399 88 455 79"/>
    <path d="M306 145C355 127 401 116 462 112"/>
    <path d="M309 164C361 151 405 148 467 151"/>
    <path d="M250 119v86m-14-74v65m28-65v65"/>
  </g>

  <!-- Dlouhý ocas -->
  <path fill="none" stroke="#050505" stroke-width="13" stroke-linecap="round" d="M250 202C250 230 253 253 250 276c-3 25-14 39-22 50-7 10-9 19-5 27"/>
  <path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M250 202C250 230 253 253 250 276c-3 25-14 39-22 50-7 10-9 19-5 27"/>

  <!-- Koule na konci ocasu -->
  <circle cx="222" cy="353" r="17" fill="url(#orb)" stroke="#fff" stroke-width="3"/>
  <path fill="none" stroke="#fff" stroke-width="2" opacity=".7" d="M215 344q8-6 15 0"/>
