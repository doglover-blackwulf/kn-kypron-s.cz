<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Černý drak letící shora</title>
  <desc id="desc">Černý drak s široce roztaženými křídly a dlouhým ocasem zakončeným koulí.</desc>
  <defs>
    <radialGradient id="orb" cx="35%" cy="30%">
      <stop offset="0" stop-color="#777"/>
      <stop offset=".55" stop-color="#222"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
  </defs>

  <!-- široká levá membrána křídla -->
  <path d="M300 145 C252 117 184 78 103 73 C58 70 25 82 6 104 C55 104 96 119 130 140 C91 136 52 146 20 168 C69 170 111 183 145 207 C117 214 91 232 71 255 C126 242 177 245 227 270 C247 280 268 291 292 307 C280 261 279 202 300 145Z" fill="#050505" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <!-- široká pravá membrána křídla -->
  <path d="M340 145 C388 117 456 78 537 73 C582 70 615 82 634 104 C585 104 544 119 510 140 C549 136 588 146 620 168 C571 170 529 183 495 207 C523 214 549 232 569 255 C514 242 463 245 413 270 C393 280 372 291 348 307 C360 261 361 202 340 145Z" fill="#050505" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>

  <!-- tělo a hlava při pohledu shora -->
  <path d="M320 72 C294 72 276 94 273 124 C268 158 274 192 285 220 C292 239 296 255 293 273 C289 297 279 323 263 348 C286 334 305 317 320 294 C335 317 354 334 377 348 C361 323 351 297 347 273 C344 255 348 239 355 220 C366 192 372 158 367 124 C364 94 346 72 320 72Z" fill="#020202" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>

  <!-- hlava a rohy -->
  <path d="M292 91 L263 58 L274 105 M348 91 L377 58 L366 105" fill="#020202" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M292 92 Q320 70 348 92 L339 119 Q320 130 301 119Z" fill="#111" stroke="#fff" stroke-width="3"/>
  <circle cx="307" cy="99" r="4" fill="#d7b638"/>
  <circle cx="333" cy="99" r="4" fill="#d7b638"/>

  <!-- paže/drápy -->
  <path d="M281 170 Q245 180 220 211 L237 208 L220 230 L250 218 L243 241 L272 211" fill="#020202" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M359 170 Q395 180 420 211 L403 208 L420 230 L390 218 L397 241 L368 211" fill="#020202" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>

  <!-- linky na křídlech -->
  <g fill="none" stroke="#777" stroke-width="2" opacity=".8">
    <path d="M294 153 Q215 120 104 103"/><path d="M287 177 Q205 153 83 151"/><path d="M283 204 Q204 193 111 208"/>
    <path d="M346 153 Q425 120 536 103"/><path d="M353 177 Q435 153 557 151"/><path d="M357 204 Q436 193 529 208"/>
    <path d="M320 132V278"/>
  </g>

  <!-- dlouhý ocas -->
  <path d="M320 270 C320 305 326 329 319 352 C313 373 295 386 276 398" fill="none" stroke="#020202" stroke-width="17" stroke-linecap="round"/>
  <path d="M320 270 C320 305 326 329 319 352 C313 373 295 386 276 398" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="265" cy="405" r="14" fill="url(#orb)" stroke="#fff" stroke-width="3"/>
</svg>
