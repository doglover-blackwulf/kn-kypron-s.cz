<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pojďme drbat | Knížky pro nás</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pristina&display=swap" rel="stylesheet">
  <style>
    body.drbat-page { background: linear-gradient(135deg, #A2B447 0%, #556F30 100%); min-height: 100vh; }
    .drbat-main { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; max-width: 1200px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
    .drbat-left { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    .drbat-right { min-width: 0; }
    .drbat-header { padding: 1.5rem; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.2); border-radius: 20px; text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,.15); }
    .drbat-title { margin: 0; font-family: 'Pristina', cursive; font-size: clamp(2.5rem, 5vw, 4.5rem); color: #000; font-weight: 400; line-height: 1.1; }

    /* Formulář na pravé straně pod nadpisem */
    .drbat-form-section { padding: 1rem; background: #fff; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
    .drbat-form-section h2 { margin: 0 0 1rem 0; font-size: 1.1rem; color: #333; text-align: center; }
    .password-section { margin-bottom: .8rem; padding: .8rem; background: #f5f5f5; border-radius: 8px; }
    .password-section label { display: block; margin-bottom: .3rem; color: #333; font-weight: 600; font-size: .85rem; }
    .password-section input { width: 100%; padding: .5rem .6rem; border: 1px solid #ddd; border-radius: 6px; font: inherit; font-size: .85rem; box-sizing: border-box; }
    .password-section input:focus { outline: none; border-color: #A2B447; background: #fafbfc; }
    .password-error { display: none; color: #d32f2f; font-size: .75rem; margin-top: .2rem; font-weight: 500; }
    .password-error.show { display: block; }
    .form-group { display: none; margin-bottom: .8rem; }
    .form-group.active { display: block; animation: slideIn .2s ease; }
    .form-group label { display: block; margin-bottom: .3rem; color: #333; font-weight: 600; font-size: .85rem; }
    .form-group input[type="file"], .form-group textarea { width: 100%; padding: .5rem .6rem; border: 1px solid #ddd; border-radius: 6px; font: inherit; font-size: .85rem; box-sizing: border-box; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-group textarea:focus { outline: none; border-color: #A2B447; background: #fafbfc; }
    .stars-container { display: flex; gap: .2rem; margin: .4rem 0; }
    .star { color: #ddd; font-size: 1.25rem; cursor: pointer; transition: transform .1s; }
    .star:hover { transform: scale(1.1); }
    .star.active { color: #ffc107; text-shadow: 0 0 4px rgba(255,193,7,.5); }
    .save-button { margin-top: .6rem; padding: .55rem .9rem; border: 0; border-radius: 6px; background: linear-gradient(135deg, #A2B447 0%, #8a9a38 100%); color: #fff; font-weight: 700; cursor: pointer; font-size: .85rem; width: 100%; transition: all .2s; box-shadow: 0 2px 6px rgba(162,180,71,.3); }
    .save-button:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(162,180,71,.4); }

    /* Příspěvky na levé straně */
    .drbat-list { display: flex; flex-direction: column; gap: 1rem; }
    .drbat-item { background: #fff; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,.14); border-left: 4px solid #A2B447; transition: transform .2s; }
    .drbat-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.18); }
    .drbat-item img { display: block; max-width: 100%; max-height: 280px; width: auto; margin: 0 auto .75rem; border-radius: 8px; object-fit: contain; }
    .drbat-text { color: #333; line-height: 1.6; white-space: pre-wrap; font-size: .95rem; margin-bottom: .5rem; }
    .drbat-stars { display: flex; gap: .15rem; margin: .6rem 0 0; }
    .drbat-stars .star { font-size: 1rem; cursor: default; color: #ddd; }
    .drbat-stars .star.active { color: #ffc107; }

    /* Tlačítko + v pravém dolním rohu */
    .add-button { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 999; width: 52px; height: 52px; padding: 0; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; border-radius: 50%; background: #000; color: #fff; font-size: 2rem; line-height: 1; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
    .add-button:hover { transform: scale(1.08); }

    @keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 800px) {
      .drbat-main { grid-template-columns: 1fr; padding: 1.25rem .75rem 5rem; }
      .drbat-form-section { order: 3; }
    }
  </style>
</head>
<body class="section-body drbat-page">
  <nav class="section-nav"><div class="logo">📚 Knížky pro nás</div><a href="index.html">Zpět</a></nav>
  <main class="drbat-main">
    <div class="drbat-left">
      <header class="drbat-header"><h1 class="drbat-title">Pojďme drbat</h1></header>
      <section class="drbat-list" id="drbat-list" aria-label="Uložené příspěvky"></section>
    </div>
    <div class="drbat-right">
      <div class="drbat-form-section">
        <h2>Přidej svůj příspěvek</h2>
        <div class="password-section"><label for="password1">Heslo pro obrázek:</label><input type="password" id="password1" placeholder="Zadej heslo..."><div class="password-error" id="password1-error">Špatné heslo!</div></div>
        <div class="password-section"><label for="password2">Heslo pro text:</label><input type="password" id="password2" placeholder="Zadej heslo..."><div class="password-error" id="password2-error">Špatné heslo!</div></div>
        <div class="form-group" id="image-form"><label for="image-input">Vložit obrázek:</label><input type="file" id="image-input" accept="image/*"></div>
        <div class="form-group" id="text-form"><label for="text-input">Tvůj příspěvek:</label><textarea id="text-input" rows="4" placeholder="Napiš cokoliv..."></textarea><label style="margin-top: .4rem;">Hodnocení:</label><div class="stars-container" id="stars-container"><span class="star" data-rating="1">★</span><span class="star" data-rating="2">★</span><span class="star" data-rating="3">★</span><span class="star" data-rating="4">★</span><span class="star" data-rating="5">★</span></div><button class="save-button" id="save-btn" type="button">Uložit příspěvek</button></div>
      </div>
    </div>
  </main>
  <button class="add-button" id="add-btn" type="button" aria-label="Přidat příspěvek">+</button>
  <script>
    const $ = id => document.getElementById(id);
    const PASSWORD1 = 'Deraxy 112';
    const PASSWORD2 = 'Laitry 113';
    let currentImage = null;
    let currentRating = 0;

    function displayItem(item) {
      const element = document.createElement('article');
      element.className = 'drbat-item';
      if (item.image) { const image = document.createElement('img'); image.src = item.image; image.alt = 'Obrázek příspěvku'; element.appendChild(image); }
      if (item.text) { const text = document.createElement('div'); text.className = 'drbat-text'; text.textContent = item.text; element.appendChild(text); }
      if (item.rating) { const stars = document.createElement('div'); stars.className = 'drbat-stars'; for (let i = 1; i <= 5; i += 1) { const star = document.createElement('span'); star.className = 'star' + (i <= item.rating ? ' active' : ''); star.textContent = '★'; stars.appendChild(star); } element.appendChild(stars); }
      $('drbat-list').appendChild(element);
    }

    try { JSON.parse(localStorage.getItem('drbat-items') || '[]').forEach(displayItem); } catch (error) { console.error(error); }

    function resetForm() { $('password1').value = ''; $('password2').value = ''; $('image-input').value = ''; $('text-input').value = ''; currentImage = null; currentRating = 0; $('image-form').classList.remove('active'); $('text-form').classList.remove('active'); document.querySelectorAll('.password-error').forEach(error => error.classList.remove('show')); document.querySelectorAll('#stars-container .star').forEach(star => star.classList.remove('active')); }

    $('add-btn').addEventListener('click', () => { $('password1').focus(); $('password1').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
    $('password1').addEventListener('change', event => { const valid = event.target.value === PASSWORD1; $('image-form').classList.toggle('active', valid); $('password1-error').classList.toggle('show', !valid); });
    $('password2').addEventListener('change', event => { const valid = event.target.value === PASSWORD2; $('text-form').classList.toggle('active', valid); $('password2-error').classList.toggle('show', !valid); });
    $('image-input').addEventListener('change', event => { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = result => { currentImage = result.target.result; }; reader.readAsDataURL(file); });
    $('stars-container').addEventListener('click', event => { if (!event.target.classList.contains('star')) return; currentRating = Number(event.target.dataset.rating); document.querySelectorAll('#stars-container .star').forEach(star => star.classList.toggle('active', Number(star.dataset.rating) <= currentRating)); });
    $('save-btn').addEventListener('click', () => { const text = $('text-input').value.trim(); if (!currentImage && !text) return alert('Vyplň alespoň něco!'); const item = { image: currentImage, text, rating: currentRating }; const items = JSON.parse(localStorage.getItem('drbat-items') || '[]'); items.push(item); localStorage.setItem('drbat-items', JSON.stringify(items)); displayItem(item); resetForm(); });
  </script>
</body>
</html>
